id = "telemetry_widget"
manifest_version = "1"
name = "System Telemetry"
version = "1.0.0"
readme = "README.md"
hecos_min_version = "0.35.0"
type = "widget"
lazy_load = true
pip_isolation = "shared"
author = "Antonio Meloni"
license = "GPL-3.0"
description = "WebUI System Telemetry dashboard widget. Shows system status, CPU/RAM/VRAM hardware metrics, audio statuses (Mic/TTS/PTT), active model and last tool."
widgets = [
    { id = "telemetry_widget", extension_path = "web_ui/extensions/telemetry_widget" },
]

[capabilities]
llm_tools = []
slash_commands = []
has_widget = true
has_config_panel = false
has_api_routes = false
has_system_calls = false
syscall_notes = ""
notes = "Displays live WebUI system metrics and status overview."
