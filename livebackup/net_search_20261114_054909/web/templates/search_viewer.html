<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tor Live Viewer — Hecos</title>
  <link rel="icon" type="image/png" href="/assets/Hecos_Logo_SQR_NBG_LogoOnly.png?v={{ version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <!-- Hecos Core Modular Design System -->
  <link rel="stylesheet" href="/assets/css/core/variables.css?v={{ version }}">
  <link rel="stylesheet" href="/assets/css/core/base.css?v={{ version }}">
  <link rel="stylesheet" href="/assets/css/core/layout.css?v={{ version }}">
  <link rel="stylesheet" href="/assets/css/core/components.css?v={{ version }}">
  <link rel="stylesheet" href="/netsearch_static/css/search.css?v={{ version }}">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg0, #0f1017);
      color: var(--text, #cad3f5);
      font-family: var(--font-main, 'Inter', sans-serif);
    }

    .viewer-header {
      height: 56px;
      background: var(--bg1, #181926);
      border-bottom: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      box-sizing: border-box;
      z-index: 20;
      position: relative;
    }

    .viewer-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .viewer-address-bar {
      flex: 1;
      max-width: 650px;
      display: flex;
      align-items: center;
      background: var(--bg0, #11121d);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 6px;
      padding: 2px 6px;
      gap: 6px;
    }

    .viewer-address-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent-cyan, #06b6d4);
      font-family: var(--font-mono, monospace);
      font-size: 11.5px;
      padding: 5px 6px;
    }

    .viewer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .viewer-frame-wrap {
      position: relative;
      width: 100%;
      height: calc(100vh - 56px);
      background: #ffffff;
      overflow: hidden;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    .viewer-loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg0, #0f1017);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .viewer-loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 900px) {
      .btn-text-hide {
        display: none;
      }
    }

    :root {
      --surface-rgb: 24, 25, 38;
    }

    .hecos-viewer-banner {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translate(-50%, -14px);
      background: rgba(24, 25, 38, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 10px 20px;
      color: var(--text, #cad3f5);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      z-index: 10050;
      opacity: 0;
      pointer-events: none;
      max-width: min(92vw, 680px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .hecos-viewer-banner.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hecos-viewer-banner.success {
      border-color: rgba(16, 185, 129, 0.45);
    }

    .hecos-viewer-banner.error {
      border-color: rgba(244, 63, 94, 0.5);
    }
  </style>
  <script src="/static/js/chat_toast_unified/chat_toast_unified.js?v={{ version }}"></script>
</head>
<body>

  <!-- ── Top Toolbar ───────────────────────────────────────────────────────── -->
  <header class="viewer-header">
    <div class="viewer-left">
      <a href="/search" class="btn btn-sm btn-secondary" style="border-radius:6px; text-decoration:none;" title="Return to Search">
        <i class="fas fa-arrow-left"></i> <span class="btn-text-hide">Search</span>
      </a>

      <div style="display:flex; align-items:center; gap:6px;">
        <img src="/assets/Hecos_Logo_SQR_NBG_LogoOnly.png?v={{ version }}" alt="Hecos" style="height:24px;">
        <span class="badge-pill badge-neutral" style="font-size:10px;">
          <i class="fas fa-user-secret" style="color:var(--accent-purple, #a855f7);"></i> Tor Gateway
        </span>
      </div>
    </div>

    <!-- URL Address Bar -->
    <div class="viewer-address-bar">
      <i class="fas fa-lock" style="color:var(--accent-purple, #a855f7); font-size:11px; margin-left:4px;" title="Encrypted Tor SOCKS5h Circuit"></i>
      <input type="text" id="viewer-url-input" class="viewer-address-input" value="{{ target_url }}" placeholder="http://...onion" onkeydown="if(event.key==='Enter') navigateToUrl()">
      <button type="button" class="btn-icon" style="width:24px; height:24px; border-radius:4px;" onclick="reloadViewer()" title="Reload page">
        <i class="fas fa-redo" style="font-size:10px;"></i>
      </button>
      <button type="button" class="btn btn-sm btn-secondary" style="border-radius:4px; font-size:10px; padding:2px 8px;" onclick="navigateToUrl()">
        Go
      </button>
    </div>

    <!-- Right Actions -->
    <div class="viewer-right">
      <div class="badge-pill {{ 'badge-ok' if tor_online else 'badge-neutral' }}" id="viewer-tor-status" title="Tor connection state">
        <div class="dot {{ 'val-ok' if tor_online else '' }}" style="width:7px; height:7px; border-radius:50%; background:{{ 'var(--green)' if tor_online else 'var(--muted)' }};"></div>
        <span style="font-size:10px;">{{ 'Tor Active' if tor_online else 'Tor Offline' }}</span>
      </div>

      <button type="button" class="btn btn-sm btn-secondary" style="border-radius:6px; font-size:11px; padding:5px 10px;" onclick="openInTorBrowser()" title="Launch this link in Desktop Tor Browser">
        <i class="fas fa-external-link-alt" style="color:var(--accent-purple, #a855f7);"></i> <span class="btn-text-hide">Tor Browser</span>
      </button>

      <button type="button" class="btn btn-sm btn-secondary" style="border-radius:6px; font-size:11px; padding:5px 10px;" onclick="copyOnionUrl()" title="Copy .onion link to clipboard">
        <i class="fas fa-copy"></i> <span class="btn-text-hide">Copy</span>
      </button>
    </div>
  </header>

  <!-- ── Main Web Viewport ─────────────────────────────────────────────────── -->
  <main class="viewer-frame-wrap">
    <div id="viewer-loading" class="viewer-loading-overlay">
      <i class="fas fa-circle-notch fa-spin fa-2x" style="color:var(--accent-cyan, #06b6d4);"></i>
      <p style="margin-top:14px; font-size:13px; color:var(--text); font-weight:600;">Routing through Tor SOCKS5h...</p>
      <span style="font-size:11px; color:var(--muted); font-family:var(--font-mono);" id="viewer-loading-url">{{ target_url }}</span>
    </div>

    <iframe id="viewer-iframe" class="viewer-frame" src="/api/hsearch/onion_proxy?url={{ target_url_encoded }}" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation allow-top-navigation-by-user-activation allow-modals allow-downloads" onload="onFrameLoaded()"></iframe>
  </main>

  <div id="hecos-viewer-banner" class="hecos-viewer-banner" role="status" aria-live="polite">
    <i id="hecos-viewer-banner-icon" class="fas fa-info-circle"></i>
    <span id="hecos-viewer-banner-msg"></span>
  </div>

  <script>
    let currentUrl = {{ target_url | tojson }};
    let _viewerBannerTimer = null;

    function showViewerBanner(msg, type = 'info', duration = 3500) {
      if (window.UnifiedToast && typeof window.UnifiedToast.show === 'function') {
        const iconMap = {
          success: 'fas fa-check-circle',
          error: 'fas fa-exclamation-triangle',
          warning: 'fas fa-exclamation-circle',
          info: 'fas fa-info-circle'
        };
        window.UnifiedToast.show(msg, iconMap[type] || 'fas fa-info-circle', duration);
        return;
      }
      const banner = document.getElementById('hecos-viewer-banner');
      const iconEl = document.getElementById('hecos-viewer-banner-icon');
      const msgEl = document.getElementById('hecos-viewer-banner-msg');
      if (!banner || !msgEl) return;
      const iconMap = {
        success: 'fas fa-check-circle',
        error: 'fas fa-exclamation-triangle',
        warning: 'fas fa-exclamation-circle',
        info: 'fas fa-info-circle'
      };
      if (iconEl) {
        iconEl.className = iconMap[type] || 'fas fa-info-circle';
        iconEl.style.color = type === 'error' ? '#fb7185' : (type === 'success' ? '#34d399' : '#06b6d4');
      }
      msgEl.textContent = msg;
      banner.classList.remove('success', 'error', 'visible');
      if (type === 'success' || type === 'error') banner.classList.add(type);
      void banner.offsetWidth;
      banner.classList.add('visible');
      clearTimeout(_viewerBannerTimer);
      _viewerBannerTimer = setTimeout(() => {
        banner.classList.remove('visible');
      }, duration);
    }

    window.addEventListener('message', function(ev) {
      if (ev && ev.data && ev.data.type === 'hecos_onion_loaded' && ev.data.url) {
        currentUrl = ev.data.url;
        const inp = document.getElementById('viewer-url-input');
        if (inp) inp.value = currentUrl;
      }
    });

    function onFrameLoaded() {
      const overlay = document.getElementById('viewer-loading');
      if (overlay) {
        overlay.classList.add('hidden');
      }
    }

    function reloadViewer() {
      const overlay = document.getElementById('viewer-loading');
      if (overlay) overlay.classList.remove('hidden');
      const iframe = document.getElementById('viewer-iframe');
      if (iframe) {
        iframe.src = '/api/hsearch/onion_proxy?url=' + encodeURIComponent(currentUrl) + '&_t=' + Date.now();
      }
    }

    function navigateToUrl() {
      const inp = document.getElementById('viewer-url-input');
      let val = inp ? inp.value.trim() : '';
      if (!val) return;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'http://' + val;
      }
      currentUrl = val;
      if (inp) inp.value = val;
      const loadingUrl = document.getElementById('viewer-loading-url');
      if (loadingUrl) loadingUrl.innerText = val;
      reloadViewer();
    }

    async function openInTorBrowser() {
      showViewerBanner('Launching Tor Browser...', 'info', 2500);
      try {
        const res = await fetch('/api/hsearch/open_tor_browser', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: currentUrl })
        }).then(r => r.json());

        if (res.ok) {
          showViewerBanner('Tor Browser launched with ' + currentUrl, 'success', 3500);
        } else {
          showViewerBanner('Could not launch Tor Browser: ' + (res.error || res.message || 'Unknown error'), 'error', 4500);
        }
      } catch (err) {
        showViewerBanner('Error contacting Tor Browser launcher: ' + err.message, 'error', 4500);
      }
    }

    function copyOnionUrl() {
      navigator.clipboard.writeText(currentUrl).then(() => {
        showViewerBanner('Copied .onion link to clipboard', 'success', 2500);
      }).catch(() => {
        showViewerBanner('Could not copy link to clipboard', 'error', 3000);
      });
    }
  </script>
</body>
</html>
