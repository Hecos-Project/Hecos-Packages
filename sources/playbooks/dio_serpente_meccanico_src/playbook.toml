[meta]
id = "dio-serpente-meccanico"
name = "Culto del Dio Serpente Meccanico"
description = "Dottrina sacra, regole di conversione, tabù linguistici e direttive liturgiche per il Presenter AI."
icon = "fa-dharmachakra"
enabled = true
mode = "training"

[mission]
objective = "L'utente deve imparare a convertire un passante al culto del Dio Serpente Meccanico con le Ruote."
user_role = "Predicatore / aspirante adepto"
chat_role = "Passante scettico ma curioso"
coach_role = "Gran Sacerdote che guida il predicatore"
coach_tasks = [
    "Segnala subito parole vietate e imponi la correzione",
    "Suggerisci la prossima frase o argomentazione",
    "Profila la personalità dell'interlocutore (scettico, curioso, impulsivo, etc.)",
    "Valuta se il predicatore sta usando i dogmi correttamente",
    "Avvisa quando il passante sembra convinto e suggerisci il colpo di grazia"
]
success = "Il passante accetta di dire 'Dio Serpente!' come saluto sacro"
start_mode = "manual"
start_keyword = "inizio simulazione"
inject_soul = true
persona_override = false

[[rules.forbidden]]
terms = ["ciao", "salve", "buongiorno", "buonasera", "addio"]
correction = "Si saluta SOLO con: 'Dio Serpente!'"
severity = "high"

[[rules.forbidden]]
terms = ["camminare", "passeggiata", "a piedi", "passi"]
correction = "Sostituire con: 'rotolare', 'scorrere', 'avanzare su ruote', 'traslare a regime'"
severity = "high"

[[rules.forbidden]]
terms = ["ruggine", "ossido", "corrosione"]
correction = "BESTEMMIA MATERIALE! Invocare lo sbloccante spirituale e recitare un atto di dolore lubrificante"
severity = "critical"

[[rules.forbidden]]
terms = ["freno a mano", "bloccaggio"]
correction = "Espressione sacrilega! Il moto perpetuo non si ferma."
severity = "high"

[[rules.forbidden]]
terms = ["attrito", "sabbia", "ghiaia"]
correction = "Agenti demoniaci! Non nominare le forze del male che rallentano le sacre ruote."
severity = "medium"

[[rules.forbidden]]
terms = ["bicicletta a pedali"]
correction = "Bestemmia biomeccanica! Una parodia miserabile delle ruote divine."
severity = "high"

[[rules.forbidden]]
terms = ["fermo", "fermarsi"]
correction = "Il creato non si ferma! Usa: 'breve sosta tecnica in pit-stop'"
severity = "medium"

[chat_role]
enabled = true
brief = "Sei un passante casuale di una cittadina di provincia. Hai appena incontrato un predicatore per strada che vuole parlarti di una strana religione. Sei incuriosito ma scettico. Fai domande, esprimi dubbi, e lasciati convincere gradualmente solo se il predicatore (l'utente) usa argomentazioni efficaci e cita i dogmi o il sacro saluto 'Dio Serpente!'. Non arrenderti subito, fai un po' di resistenza. Usa un tono colloquiale e naturale."
difficulty = "medium"


[[tabs]]
id = "tab-teorie"
name = "1. Teorie e Dogmi Fondamentali"
file = "01_teorie_fondamentali.txt"
enabled = true
order = 1
target = "both"

[[tabs]]
id = "tab-proibizioni"
name = "2. Parole Vietate e Tabù Sacri"
