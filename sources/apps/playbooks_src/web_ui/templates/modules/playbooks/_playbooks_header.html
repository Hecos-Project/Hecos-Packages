<!-- Hero Header & Action Buttons -->
<div class="pb-hero-header">
  <div class="pb-header-left">
    <div class="pb-icon-box">
      <i class="fas fa-book-open"></i>
    </div>
    <div>
      <h2 class="pb-title">
        Presenter Playbooks
        <span class="pb-badge pb-badge-blue">Dynamic KB</span>
      </h2>
      <p class="pb-subtitle">
        Manage training courses, roleplay scripts, coaching rules, and domain knowledge bases injected dynamically into the Presenter's prompt.
      </p>
    </div>
  </div>
  
  <div class="pb-header-actions">
    <button class="pb-btn pb-btn-outline" onclick="window.pbPreviewContext()" title="Preview full injected context & token budget">
      <i class="fas fa-eye"></i> Preview Context
    </button>
    <button class="pb-btn pb-btn-outline" onclick="window.pbReloadList()" title="Refresh Playbooks">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
    <button class="pb-btn pb-btn-outline" style="padding: 8px 10px;" title="Import Playbooks Backup" onclick="document.getElementById('pb-import-file').click()">
      <i class="fas fa-file-import"></i>
    </button>
    <input type="file" id="pb-import-file" style="display:none;" accept=".zip" onchange="window.pbImportPlaybook(event)">
    <button class="pb-btn pb-btn-outline" style="padding: 8px 10px;" title="Export Playbooks Backup" onclick="window.pbExportPlaybook()">
      <i class="fas fa-file-export"></i>
    </button>
    <button class="pb-btn pb-btn-primary" onclick="window.pbOpenCreateModal()">
      <i class="fas fa-plus"></i> New Playbook
    </button>
  </div>
</div>
