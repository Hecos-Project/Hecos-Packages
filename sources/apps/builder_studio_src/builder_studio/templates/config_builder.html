<script>
  (function() {
      const checkAndRun = () => {
          if (typeof window.builderRefreshSources === 'function') {
              window.builderRefreshSources();
          } else {
              setTimeout(checkAndRun, 100);
          }
      };
      checkAndRun();
  })();
// Safety guard: prevent Enter key from accidentally confirming the Wipe/Confirm modal
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const modal = document.getElementById('builder-confirm-modal');
    // If the modal is NOT visible, prevent Enter from bubbling to any button inside it
    if (modal && modal.style.display === 'none') {
      // Check if the active element is NOT inside the modal itself
      const yesBtn = document.getElementById('builder-confirm-modal-yes');
      if (document.activeElement === yesBtn) {
        e.preventDefault();
      }
    }
    // Also: if we're focused on an input/textarea that is NOT inside the modal, stop Enter from triggering buttons
    const tag = document.activeElement ? document.activeElement.tagName : '';
    if ((tag === 'INPUT' || tag === 'TEXTAREA') && modal && modal.style.display === 'none') {
      // Prevent Enter from submitting or triggering random buttons
      const inModal = modal.contains(document.activeElement);
      if (!inModal) {
        // Only stop propagation - don't prevent default so the field still works normally
        e.stopPropagation();
      }
    }
  }
});
</script>

<div id="hpm-folder-picker-modal" class="modal-bg" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; align-items:center; justify-content:center;">
    <div class="modal-content" style="background:var(--bg); border:1px solid var(--border-color); border-radius:12px; padding:20px; width:500px; max-width:90%; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,0.5);">
        <h3 style="margin-top:0; color:var(--text);"><i class="fas fa-folder-open" style="color:var(--accent); margin-right:8px;"></i> Select Folder</h3>
        
        <div style="display:flex; gap:10px; margin-bottom:15px; align-items:center;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="window.builderPickerUp()"><i class="fas fa-level-up-alt"></i> Up</button>
            <input type="text" id="hpm-picker-path" class="config-input" style="flex:1;" readonly>
        </div>
        
        <div id="hpm-picker-list" class="custom-scrollbar" style="flex:1; min-height:300px; max-height:400px; overflow-y:auto; background:var(--bg-secondary, #1e1e1e); border-radius:6px; border:1px solid rgba(255,255,255,0.05); padding:5px;">
            <!-- Folders will be listed here -->
        </div>
        
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
            <button type="button" class="btn btn-secondary" onclick="document.getElementById('hpm-folder-picker-modal').style.display='none'">Cancel</button>
            <button type="button" class="btn btn-primary" onclick="window.builderPickerConfirm()">Select</button>
        </div>
    </div>
</div>


<script>
    if (!window.builderInitInterval) {
        window.builderInitInterval = setInterval(() => {
            const bp = document.getElementById('tab-builder');
            if (typeof window.builderRefreshSources === 'function' && bp && bp.classList.contains('active')) {
                clearInterval(window.builderInitInterval);
                window.builderInitInterval = null;
                window.builderRefreshSources();
            }
        }, 100);
    }
</script>
