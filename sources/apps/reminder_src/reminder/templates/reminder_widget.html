<div class="sidebar-card" id="reminder-widget" style="padding:10px 12px;">
    <div class="sidebar-card-title" style="cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:0; padding:0;" onclick="reminderWidget.toggleBody()">
        <span class="ql-icon"><i class="fas fa-bell"></i></span>
        <span class="ql-title">{{ t('ext_reminder_title') }}</span>
        <span onclick="event.stopPropagation(); window.hecosOpenConfig('#reminder')" 
              style="margin-left:auto; cursor:pointer; font-size:12px; opacity:0.6; padding-right:4px;" 
              title="Configure Reminder"><i class="fas fa-cog"></i></span>
        <span class="ql-chevron" id="reminder-widget-toggle"><i class="fas fa-chevron-down"></i></span>
    </div>
    
    <div id="reminder-widget-body" class="ql-body" style="margin-top:8px;">
        {# ── Upcoming & last 3 expired list (compact 2-row items) ── #}
        <div id="reminder-list" class="rem-list">
          <span style="color:var(--muted);font-size:0.8em;padding-left:12px;">{{ t('webui_chat_loading') }}</span>
        </div>

        {# ── Dual-Mode Add Form ── #}
        <form id="reminder-quick-add" onsubmit="reminderWidget.quickAdd(event)"
              style="display:flex;flex-direction:column;gap:5px;">
          <input id="reminder-title-input" class="ql-input" type="text" placeholder="What to remind you about..."
                 autocomplete="off" required>
          
          <div style="display:flex;gap:4px;align-items:center;">
              <input id="reminder-when-input" class="ql-input" type="text" placeholder="Ex: in 5 min, tomorrow 12:30..."
                     autocomplete="off" required style="flex:1;">
              
              <button type="button" class="ql-add-btn" style="width:36px;padding:4px;flex-shrink:0;background:rgba(255,200,60,0.15);border-color:rgba(255,200,60,0.3);color:#ffc83c;" onclick="reminderWidget.pickWheelTime()" title="Pick Exact Time">
                  <i class="far fa-clock"></i>
              </button>
              
              <button type="submit" class="ql-add-btn" style="width:36px;padding:4px;flex-shrink:0;">
                  <i class="fas fa-plus"></i>
              </button>
          </div>
          
          <!-- Quick Chips -->
          <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:2px; justify-content:center;">
              <span class="rem-chip" onclick="reminderWidget.setChip('in 5 min')">+ 5m</span>
              <span class="rem-chip" onclick="reminderWidget.setChip('in 15 min')">+ 15m</span>
              <span class="rem-chip" onclick="reminderWidget.setChip('in 30 min')">+ 30m</span>
              <span class="rem-chip" onclick="reminderWidget.setChip('in 1 hour')">+ 1h</span>
              <span class="rem-chip" onclick="reminderWidget.setChip('in 10 min')">Pasta <i class="fas fa-utensils"></i></span>
          </div>

          <div id="reminder-quick-msg" style="font-size:10px;min-height:12px;text-align:center;"></div>
        </form>

        <style>
        .rem-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
            max-height: 195px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .rem-list::-webkit-scrollbar { width: 4px; }
        .rem-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 4px;
        }
        .rem-item {
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            padding: 5px 8px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .rem-item.is-expired {
            border-color: rgba(255, 100, 100, 0.16);
            background: rgba(255, 80, 80, 0.04);
        }
        .rem-row-top,
        .rem-row-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-width: 0;
        }
        .rem-title {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            color: var(--text);
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rem-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .rem-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .rem-meta {
            flex: 1;
            min-width: 0;
            font-size: 10px;
            color: var(--muted);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rem-mode-pill {
            flex-shrink: 0;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 8.5px;
            font-weight: 700;
            line-height: 1.3;
            letter-spacing: 0.2px;
            cursor: pointer;
            outline: none;
        }
        .rem-more-hint {
            font-size: 10px;
            color: var(--muted);
            opacity: 0.78;
            text-align: right;
            padding: 1px 4px;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .rem-more-hint:hover {
            opacity: 1;
            color: var(--text);
        }
        .rem-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .rem-chip:hover { background: rgba(52,152,219,0.2); color: #3498db; border-color: rgba(52,152,219,0.4); }
        </style>
    </div>
</div>

<script>
window.reminderWidget = (function() {
  const COLLAPSED_KEY = 'hecos-rem-collapsed';
  const MAX_EXPIRED = 3;
  const MAX_UPCOMING = 5;
  let _collapsed = localStorage.getItem(COLLAPSED_KEY) === '1';

  function _esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function _applyCollapsed(yes) {
    const body = document.getElementById('reminder-widget-body');
    const tog  = document.getElementById('reminder-widget-toggle');
    if (body) body.style.display = yes ? 'none' : '';
    if (tog)  tog.classList.toggle('collapsed', yes);
  }

  function toggleBody() {
    _collapsed = !_collapsed;
    localStorage.setItem(COLLAPSED_KEY, _collapsed ? '1' : '0');
    _applyCollapsed(_collapsed);
  }

  function _isExpired(r, nowMs) {
    if (r.repeat && r.cron_expr) return false;
    if (!r.when_iso) return false;
    const ts = Date.parse(r.when_iso);
    return !Number.isNaN(ts) && ts < nowMs;
  }

  function _tsOf(isoStr) {
    if (!isoStr) return null;
    const ts = Date.parse(isoStr);
    return Number.isNaN(ts) ? null : ts;
  }

  function _shortDate(whenIso) {
    if (!whenIso) return '';
    try {
      const d = new Date(whenIso);
      const now = new Date();
      const dateOpts = d.getFullYear() === now.getFullYear()
        ? { day: '2-digit', month: '2-digit' }
        : { day: '2-digit', month: '2-digit', year: '2-digit' };
      return d.toLocaleDateString(undefined, dateOpts) + ' ' +
             d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return '';
    }
  }

  function _fmt(r) {
    if (r.repeat && r.cron_expr) return '<i class="fas fa-redo"></i> ' + t('ext_reminder_recurrent');
    if (r.when_iso) {
      try {
        const d = new Date(r.when_iso);
        const now = new Date();
        const diff = d - now;
        if (diff < 0)        return '<i class="fas fa-bell"></i> ' + t('ext_reminder_expired');
        if (diff < 60000)    return '<i class="fas fa-bell"></i> &lt;1m';
        if (diff < 3600000)  return `<i class="fas fa-bell"></i> ${Math.round(diff/60000)}m`;
        if (diff < 86400000) return `<i class="fas fa-bell"></i> ${Math.round(diff/3600000)}h`;
        return `<i class="fas fa-calendar-alt"></i> ${d.toLocaleDateString(undefined, {day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString(undefined, {hour:'2-digit',minute:'2-digit'})}`;
      } catch(e) { return _esc(r.when_iso); }
    }
    return '';
  }

  function _selectWidgetReminders(allActive) {
    const nowMs = Date.now();
    const upcoming = [];
    const expiredAll = [];

    for (const r of allActive) {
      if (_isExpired(r, nowMs)) {
        expiredAll.push(r);
      } else {
        upcoming.push(r);
      }
    }

    // Upcoming: soonest scheduled first, recurring without when_iso after
    upcoming.sort((a, b) => {
      const ta = _tsOf(a.when_iso);
      const tb = _tsOf(b.when_iso);
      if (ta === null && tb === null) return 0;
      if (ta === null) return 1;
      if (tb === null) return -1;
      return ta - tb;
    });

    // Expired: keep only the latest MAX_EXPIRED (most recently expired first)
    expiredAll.sort((a, b) => {
      const ta = _tsOf(a.when_iso) ?? _tsOf(a.created_at) ?? 0;
      const tb = _tsOf(b.when_iso) ?? _tsOf(b.created_at) ?? 0;
      return tb - ta;
    });

    const visibleUpcoming = upcoming.slice(0, MAX_UPCOMING);
    const visibleExpired = expiredAll.slice(0, MAX_EXPIRED);
    const hiddenExpired = Math.max(0, expiredAll.length - visibleExpired.length);

    return {
      items: visibleUpcoming.concat(visibleExpired),
      hiddenExpired,
      nowMs,
    };
  }

  function refresh() {
    fetch('/api/ext/reminder/all?status=active')
      .then(r => r.json())
      .then(data => {
        const list = document.getElementById('reminder-list');
        if (!list) return;
        if (!data.ok || !data.reminders || data.reminders.length === 0) {
          list.innerHTML = `<span style="color:var(--muted);font-size:0.8em;padding-left:4px;">${t('ext_reminder_none')}</span>`;
          return;
        }

        const { items, hiddenExpired, nowMs } = _selectWidgetReminders(data.reminders);

        let html = items.map(r => {
          let isInt = r.interactive === 1;
          if (r.interactive === null || r.interactive === undefined) {
             isInt = !!(window.cfg && window.cfg.plugins && window.cfg.plugins.REMINDER && window.cfg.plugins.REMINDER.reminder_snooze_ui);
          }
          const modePillStyle = isInt
            ? 'background:rgba(var(--yellow-rgb),0.1);border:1px solid rgba(var(--yellow-rgb),0.25);color:var(--yellow);'
            : 'background:var(--glass);border:1px solid var(--border);color:var(--muted);';
          const modeLabel = isInt ? 'INTERACTIVE' : 'SIMPLE';
          const nextMode = isInt ? false : true;
          const isExp = _isExpired(r, nowMs);
          const safeTitle = _esc(r.title);
          const safeId = _esc(r.id);

          let metaHtml = '';
          if (r.when_iso) {
            const shortDate = _shortDate(r.when_iso);
            const expColor = isExp ? 'color:#f08a8a;' : '';
            metaHtml = `<i class="far fa-calendar-alt" style="margin-right:3px;opacity:0.75;"></i>${shortDate} <span style="opacity:0.85;margin-left:3px;${expColor}">(${_fmt(r)})</span>`;
          } else if (r.repeat) {
            metaHtml = _fmt(r);
          }

          return `
          <div class="ql-item rem-item${isExp ? ' is-expired' : ''}">
            <div class="rem-row-top">
                <span class="rem-title" title="${safeTitle}">
                    <i class="far fa-clock" style="color:${isExp ? '#f08a8a' : '#ffc83c'};margin-right:4px;font-size:11px;"></i><strong>${safeTitle}</strong>
                </span>
                <div class="rem-actions">
                    <button onclick="reminderWidget.snooze('${safeId}')" title="Snooze 15 min"
                            class="rem-action-btn" style="font-size:11px;color:rgba(255,255,255,0.6);">zzz</button>
                    <button onclick="reminderWidget.cancel('${safeId}')" title="Cancel"
                            class="rem-action-btn" style="font-size:12px;color:rgba(255,80,80,0.85);"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="rem-row-meta">
                <span class="rem-meta">${metaHtml}</span>
                <button onclick="reminderWidget.toggleMode('${safeId}', ${nextMode})" title="Change Mode"
                        style="${modePillStyle}" class="rem-mode-pill reminder-mode-toggle">${modeLabel}</button>
            </div>
          </div>
          `;
        }).join('');

        if (hiddenExpired > 0) {
          html += `<div class="rem-more-hint" onclick="window.hecosOpenConfig('#reminder')" title="Manage all reminders in Config">+${hiddenExpired} ${t('ext_reminder_expired')} · <i class="fas fa-cog"></i></div>`;
        }

        list.innerHTML = html;
      })
      .catch(() => {
        const list = document.getElementById('reminder-list');
        if (list) list.innerHTML = `<span style="color:var(--muted);font-size:0.8em;">${t('ext_reminder_err')}</span>`;
      });
  }

  function quickAdd(e) {
    e.preventDefault();
    const titleInp = document.getElementById('reminder-title-input');
    const whenInp  = document.getElementById('reminder-when-input');
    const title = titleInp.value.trim();
    const when  = whenInp.value.trim();
    const msg   = document.getElementById('reminder-quick-msg');
    if (!title || !when) return;
    
    const btn = e.target.querySelector('button[type="submit"]') || e.target.querySelector('.ql-add-btn') || e.target;
    const oldBtnHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    titleInp.disabled = true;
    whenInp.disabled = true;

    if (msg) {
        msg.style.color = 'var(--muted)';
        msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scheduling...';
    }

    fetch('/api/ext/reminder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ title, when })
    })
    .then(r => r.json())
    .then(data => {
      btn.innerHTML = oldBtnHtml;
      btn.disabled = false;
      titleInp.disabled = false;
      whenInp.disabled = false;

      if (msg) {
        msg.style.color = data.ok ? 'var(--accent)' : '#e05';
        msg.innerHTML = data.ok ? '<i class="fas fa-check-circle"></i> ' + (window.I18N && window.I18N.command_executed ? window.I18N.command_executed : 'Done') : (data.error || data.message || 'Error');
        setTimeout(() => { if (msg) msg.textContent = ''; }, 3000);
      }
      if (data.ok) {
        titleInp.value = '';
        whenInp.value = '';
        refresh();
      }
    })
    .catch(() => {
        btn.innerHTML = oldBtnHtml;
        btn.disabled = false;
        titleInp.disabled = false;
        whenInp.disabled = false;
        if (msg) { msg.style.color='#e05'; msg.textContent='Network error'; }
    });
  }

  function cancel(id) {
    fetch('/api/ext/reminder/stop', { method: 'POST' });
    fetch(`/api/ext/reminder/${id}`, { method: 'DELETE' })
      .then(() => refresh());
  }

  function snooze(id) {
    fetch(`/api/ext/reminder/${id}/snooze`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ minutes: 15 })
    }).then(() => refresh());
  }

  function toggleMode(id, nextMode) {
    fetch(`/api/ext/reminder/${id}/interactive`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ interactive: nextMode })
    }).then(() => refresh());
  }

  function pickWheelTime() {
    if (typeof HecosWheelPicker === 'undefined') {
      console.warn('HecosWheelPicker is not available.');
      return;
    }
    HecosWheelPicker.open({
      mode: 'datetime',
      onConfirm: (isoString) => {
        const inp = document.getElementById('reminder-when-input');
        if (inp) {
            inp.value = isoString;
            inp.style.backgroundColor = 'rgba(52,152,219,0.2)';
            setTimeout(() => inp.style.backgroundColor = '', 400);
        }
      }
    });
  }

  function setChip(val) {
    const inp = document.getElementById('reminder-when-input');
    if (inp) {
        inp.value = val;
        inp.style.backgroundColor = 'rgba(52,152,219,0.2)';
        setTimeout(() => inp.style.backgroundColor = '', 400);
    }
  }

  // Auto-refresh every 60 seconds
  setInterval(refresh, 60000);
  
  // Initial load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => { _applyCollapsed(_collapsed); refresh(); });
  } else {
    _applyCollapsed(_collapsed);
    refresh();
  }

  return { refresh, quickAdd, cancel, snooze, toggleBody, toggleMode, pickWheelTime, setChip };
})();
</script>
