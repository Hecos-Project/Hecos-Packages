api_routes_file = "web/routes.py"
author = "Antonio Meloni"
dependencies = [
    "contacts",
    "browser_automation",
]
optional_dependencies = [
    "templates",
]
description = "Modular messaging hub for WhatsApp and Telegram with smart Contacts resolution, Persona-aware multi-bot Telegram selection, photo & document delivery, deterministic WhatsApp Web 2026 stanza verification, and 15-minute follow-up channel continuity.\n\n**Quick Commands:**\n- `/msg <platform>:<contact_or_address> <text>`: Direct send bypassing AI (e.g. `/msg whatsapp:Rowena Hello!`).\n- `/send`: Alias of `/msg`.\n"
hecos_min_version = "0.49.0"
icon_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/Hecos_module_Image_preview_square.png"
id = "messenger"
is_class_based = true
lazy_load = false
license = "GPL-3.0"
manifest_version = "1.1.0"
name = "Messenger"
pip_isolation = "shared"
plugin_dir = "."
readme = "README.md"
readme_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/messenger_src/README.md"
tag = "MESSENGER"
target_dir = "hpm"
type = "plugin"
version = "2.4.3"
screenshots = [
    "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/sources/plugins/messenger_src/preview_1.png",
]
signature = "DTKBUX1j61qzeeppY3RekdvWikMI9hk6z5UrjuqdxW03awJMyIIiKeo6aJfSVbb0lfd22lmSEjaAmAb6O6IyCQ=="

[capabilities]
llm_tools = [
    "send_message",
    "send_photo",
    "send_document",
    "list_accounts",
    "check_connection",
]
slash_commands = [
    "/msg",
    "/send",
]
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = ""

[commands]
check_connection = "Checks live connectivity and readiness of WhatsApp and Telegram."
list_accounts = "Lists configured WhatsApp and Telegram accounts and active delivery methods."
send_document = "Sends a document or file (PDF, HTML, DOCX, ZIP, audio, video) on Telegram or WhatsApp."
send_message = "Sends a text message (and optional attachments) to a contact name or address on WhatsApp or Telegram."
send_photo = "Sends a photo or image file ('latest' or [[IMG:filename]]) on Telegram or WhatsApp."

[config_panel]
api_routes_file = "web/routes.py"
category = "CONNETTIVITÀ"
config_api_get = "/hecos/api/plugins/messenger/config"
config_api_post = "/hecos/api/plugins/messenger/config"
tab_icon = "fa-paper-plane"
tab_id = "messenger"
tab_label = "Messenger"
template_file = "web/templates/config_messenger.html"

[routing]
instructions = "Use MESSENGER__send_message, MESSENGER__send_photo, or MESSENGER__send_document for WhatsApp ('wazzap') and Telegram. Never claim a message/photo was sent unless a MESSENGER tool returned ✅ in this turn. Write all messages and captions naturally in first-person character without mentioning AI or tools. For new selfies/photos, call IMAGE_GEN__generate_image first, then call MESSENGER__send_photo(image_path='latest', ...) — NEVER use EXECUTOR to create fake image files! On follow-ups ('send another one'), omit platform to reuse the verified recent channel; if unsure, ask the user."

[[slash_commands]]
aliases = [
    "/msg",
    "/send",
]
description = "Sends a direct message via WhatsApp or Telegram (supports contact names from Address Book)."
example = "/msg whatsapp:Rowena Hello, this is a test!"
icon = "💬"
id = "msg"
manifest_version = "1.1.0"
method = "msg_command"
requires_args = true
usage = "/msg <platform:contact_or_address> <message_text>"

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MESSENGER__send_message"
description = "Sends a text message (and optional attachments) on WhatsApp or Telegram. Automatically resolves contact names from Hecos Contacts! ALWAYS invoke this tool before claiming a message was sent. Once it returns ✅, do NOT call it again with the same message."

[tool_schema.function.parameters]
type = "object"
required = [
    "text",
]

[tool_schema.function.parameters.properties.to]
type = "string"
description = "Target recipient: 'group:<GroupName>' for a Telegram group/channel (e.g. 'group:Hecos'), a Contact name from Address Book (e.g. 'Rowena', or 'admin' when messaging the user privately), 'last' for an immediate follow-up within 15 minutes, or direct address ('whatsapp:+393331234567', 'telegram:@channel', 'telegram:123456789')."

[tool_schema.function.parameters.properties.text]
type = "string"
description = "Message body to send (single-line or multi-line), written naturally in first-person staying strictly in character."

[tool_schema.function.parameters.properties.platform]
type = "string"
enum = [
    "whatsapp",
    "telegram",
]
description = "Target messaging platform: 'whatsapp' (also when user says 'wazzap' / 'whatsapp web') or 'telegram'. Omit on immediate follow-up messages so Messenger reuses the verified recent channel."

[tool_schema.function.parameters.properties.bot_name]
type = "string"
description = "Optional Telegram bot identifier (e.g. 'Urania', 'hecos'). Omit to automatically select the bot matching your active persona."

[tool_schema.function.parameters.properties.attachments]
type = "array"
description = "Optional list of file paths or filenames to attach with the message."

[tool_schema.function.parameters.properties.attachments.items]
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MESSENGER__send_photo"
description = "Sends a photo or image file to a contact or channel on Telegram or WhatsApp. When sending a newly captured/created selfie or photo: call IMAGE_GEN__generate_image first, then call MESSENGER__send_photo with image_path='latest' (or the [[IMG:filename]]). NEVER use EXECUTOR__write_file to fake .jpg files!"

[tool_schema.function.parameters]
type = "object"
required = []

[tool_schema.function.parameters.properties.to]
type = "string"
description = "Contact name (e.g. 'admin' for the user, 'Rowena'), 'last' for follow-ups, or platform address ('telegram:@channel', 'whatsapp:+393331234567')."

[tool_schema.function.parameters.properties.image_path]
type = "string"
description = "Pass 'latest' to send the most recently created photo/image, or the bare filename from [[IMG:filename.png]], or an existing image path on disk."

[tool_schema.function.parameters.properties.caption]
type = "string"
description = "Optional caption sent with the photo. Write naturally in first-person staying strictly in character (e.g. 'a photo of me' / 'my selfie'); NEVER mention AI, generation, or tools."

[tool_schema.function.parameters.properties.platform]
type = "string"
enum = [
    "whatsapp",
    "telegram",
]
description = "Target platform ('telegram' or 'whatsapp'). Omit on immediate follow-ups to reuse the verified recent channel."

[tool_schema.function.parameters.properties.bot_name]
type = "string"
description = "Optional Telegram bot identifier (e.g. 'Urania', 'hecos'). Omit to auto-match your active persona."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MESSENGER__send_document"
description = "Sends a document or file (PDF, HTML, DOCX, TXT, ZIP, audio, video) to a contact or channel on Telegram or WhatsApp."

[tool_schema.function.parameters]
type = "object"
required = [
    "file_path",
]

[tool_schema.function.parameters.properties.to]
type = "string"
description = "Contact name (e.g. 'admin', 'Rowena'), 'last' for follow-ups, or platform address."

[tool_schema.function.parameters.properties.file_path]
type = "string"
description = "Path or filename of the document/file to send (e.g. PDF path from DOCS__generate_pdf, or 'latest' for the newest generated document)."

[tool_schema.function.parameters.properties.caption]
type = "string"
description = "Optional caption accompanying the document, written naturally in character."

[tool_schema.function.parameters.properties.platform]
type = "string"
enum = [
    "whatsapp",
    "telegram",
]
description = "Target platform ('telegram' or 'whatsapp')."

[tool_schema.function.parameters.properties.bot_name]
type = "string"
description = "Optional Telegram bot identifier ('Urania', 'hecos'). Omit to auto-match active persona."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MESSENGER__list_accounts"
description = "Returns configured WhatsApp and Telegram accounts and their active delivery methods."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties]

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MESSENGER__check_connection"
description = "Tests live connectivity for WhatsApp and/or Telegram and reports readiness."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.platform]
type = "string"
enum = [
    "whatsapp",
    "telegram",
]
description = "Optional platform to check ('whatsapp' or 'telegram'). Omit to check all."

