id = "mail"
manifest_version = "1"
name = "Mail"
version = "1.4.3"
author = "Antonio Meloni"
license = "GPL-3.0"
description = "Integrated mail client for Hecos. Reads SMTP/IMAP profiles, manages drafts, sending, and syncing with automatic provider support and Address Book integration."
type = "plugin"
pip_isolation = "shared"
target_dir = "hpm"
plugin_dir = "."
hecos_min_version = "0.40.0"
icon_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/Hecos_module_Image_preview_square.png"
readme = "README.md"
readme_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/mail_src/README.md"
dependencies = [
    "templates",
]
tag = "MAIL"
lazy_load = true
is_class_based = true
api_routes_file = "web/routes.py"
signature = "U7H9N2CZosqlptev7pSYxfhE2KiSFYrdki46+ROhCacGhUyT5InW5E+EwSZRnRrk58mJaA2mgmqGsK/+8cr1Cw=="

[commands]
sync_emails = "Synchronizes the mailbox by fetching new messages via IMAP."
send_email = "Sends an email using the SMTP client. Supports HTML, text, and attachments."
list_emails = "Lists emails from the inbox or a specified folder."
get_email = "Retrieves a single email by ID with full body and attachments."

[config_panel]
tab_id = "mail"
tab_label = "Mail"
tab_icon = "fa-envelope"
category = "CONNETTIVITÀ"
template_file = "web/templates/config_mail.html"
api_routes_file = "web/routes.py"
config_api_get = "/api/mail/config"
config_api_post = "/api/mail/config"

[capabilities]
llm_tools = [
    "send_email",
    "sync_emails",
    "list_emails",
    "get_email",
]
slash_commands = []
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = "Stores messages in local SQLite DB at hecos/memory/mail.db. Credentials stored in mail.toml (never in git)."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MAIL__send_email"
description = "Sends an email to one or more recipients. Use when the user says 'send an email', 'manda una mail', 'scrivi a [name]', 'write to [email]'. Supports plain text, HTML body, CC, BCC, and template-based emails. IMPORTANT: When the user asks to use a template, you MUST set template_id (partial name is fine, e.g. 'all purpose') and template_vars with a JSON of the template variables (e.g. subject, message). The 'All Purpose' template variables are: subject (email subject line) and message (the HTML body content). When using a template, you can leave body empty."

[tool_schema.function.parameters]
type = "object"
required = [
    "to",
]

[tool_schema.function.parameters.properties.to]
type = "string"
description = "Recipient email address or comma-separated list of addresses."

[tool_schema.function.parameters.properties.subject]
type = "string"
description = "Subject line of the email."

[tool_schema.function.parameters.properties.body]
type = "string"
description = "Email body content. Can be plain text or HTML."

[tool_schema.function.parameters.properties.cc]
type = "string"
description = "Optional: CC recipients (comma-separated email addresses)."

[tool_schema.function.parameters.properties.bcc]
type = "string"
description = "Optional: BCC recipients (comma-separated email addresses)."

[tool_schema.function.parameters.properties.account_id]
type = "string"
description = "Optional: ID of the mail account to send from."

[tool_schema.function.parameters.properties.template_id]
type = "string"
description = "Optional: ID or partial Name of a Template to use. Fuzzy matching is supported: 'all purpose' will match 'Hecos — Generic Template (All Purpose)'. If provided, the template HTML is rendered and used as body."

[tool_schema.function.parameters.properties.template_vars]
type = "string"
description = "Required when template_id is set. JSON string of variables to inject. For 'All Purpose' template: {\"subject\": \"Headline\", \"subtitle\": \"Sub\", \"message\": \"HTML text\", \"image_main\": \"URL for big image\", \"image_avatar\": \"URL for small avatar\"}. Images are optional; omitting them uses defaults."

[tool_schema.function.parameters.properties.attachments]
type = "string"
description = "Optional: JSON list or comma-separated list of absolute file paths to attach to the email."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MAIL__sync_emails"
description = "Fetches and syncs new emails from the IMAP server. Use when the user says 'check my email', 'sync mail', 'controlla le email', 'nuove email?'."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.folder]
type = "string"
description = "Optional: IMAP folder to sync (default: INBOX)."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MAIL__list_emails"
description = "Lists emails from the inbox or specified folder. Use when the user asks 'show my emails', 'mostrami le email', 'lista messaggi', 'ultime email'."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.folder]
type = "string"
description = "Optional: IMAP folder name (default: INBOX)."

[tool_schema.function.parameters.properties.limit]
type = "integer"
description = "Optional: max number of emails to return (default: 20)."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "MAIL__get_email"
description = "Retrieves a single email by its ID. Use when the user asks to read or open a specific message."

[tool_schema.function.parameters]
type = "object"
required = [
    "email_id",
]

[tool_schema.function.parameters.properties.email_id]
type = "string"
description = "The unique ID of the email to retrieve."

[[slash_command]]
name = "/mail"
description = "Opens, lists, or checks your emails. You can also specify an action like '/mail sync' or '/mail read <id>'."
action_type = "llm_agent"
prompt_template = "Please help me manage my emails. Here is my request: {{user_input}}. If I didn't specify anything, just list my recent emails."

[[slash_command]]
name = "/send"
description = "Send a new email. Example: '/send an email to Tony saying hi' or just '/send' to start an interactive drafting process."
action_type = "llm_agent"
prompt_template = "I want to send an email. Please help me draft and send it using the send_email tool. Request: {{user_input}}"

