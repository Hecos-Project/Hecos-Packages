<!-- MAIL COMPOSE MODAL -->
<style>
.mail-modal-overlay {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.mail-modal-overlay.active { opacity: 1; pointer-events: auto; }

.mail-modal {
    width: 90%; max-width: 720px; height: 90vh; max-height: 820px;
    background: var(--bg-glass-dark, rgba(20,20,35,0.97));
    border: 1px solid var(--border-color, rgba(255,255,255,0.1));
    border-radius: 16px;
    box-shadow: 0 16px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
    transform: scale(0.95) translateY(20px);
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.mail-modal-overlay.active .mail-modal { transform: scale(1) translateY(0); }

/* Top bar with title + close */
.mail-modal-header {
    padding: 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.03);
    border-radius: 16px 16px 0 0;
    flex-shrink: 0;
}
.mail-modal-title { font-weight: 700; color: var(--text-primary, #e0e0f0); font-size: 1.05rem; }
.mail-modal-close {
    background: none; border: none; font-size: 1.2rem; cursor: pointer;
    color: var(--text-muted, rgba(200,200,220,0.5)); transition: color 0.15s;
}
.mail-modal-close:hover { color: #ff6b6b; }

/* Recipient fields */
.mail-fields-area {
    padding: 10px 20px; flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; gap: 0;
}
.mail-compose-row {
    display: flex; gap: 12px; align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.mail-compose-row:last-child { border-bottom: none; }
.mail-compose-label {
    width: 70px; font-size: 0.78rem; font-weight: 600;
    color: var(--text-muted, rgba(200,200,220,0.55)); text-align: right; flex-shrink: 0;
}
.mail-compose-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary, #fff); font-size: 0.9rem; font-family: inherit;
}

/* Template selector */
#mail-compose-template {
    flex: 1; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px; outline: none;
    color: var(--text-primary, #e0e0f0);
    font-size: 0.87rem; font-family: inherit;
    padding: 4px 8px; cursor: pointer;
}
#mail-compose-template option {
    background: #1e1e2e;
    color: #e0e0f0;
}

/* 3-part editor area */
.mail-compose-3panel {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}

.mail-compose-section {
    display: flex; flex-direction: column; flex-shrink: 0;
}
.mail-compose-section.body-section {
    flex: 1; min-height: 0;
}

.mail-compose-section-label {
    padding: 5px 16px 3px;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted, rgba(200,200,220,0.4));
    background: rgba(255,255,255,0.02);
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 8px;
}
.mail-compose-section-label .section-badge {
    font-size: 0.65rem; padding: 1px 6px; border-radius: 10px;
    font-weight: 600; letter-spacing: 0.05em;
}
.badge-header { background: rgba(99,102,241,0.2); color: #818cf8; }
.badge-body   { background: rgba(16,185,129,0.2); color: #34d399; }
.badge-footer { background: rgba(245,158,11,0.2); color: #fbbf24; }

.mail-compose-section-content {
    display: flex; flex-direction: column;
}
.mail-compose-section.body-section .mail-compose-section-content {
    flex: 1; min-height: 0;
}

/* Preview band (header/footer with template) */
.mail-template-iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    display: block;
}
.mail-template-band {
    padding: 0; min-height: 100px; max-height: 250px;
    background: rgba(255,255,255,0.025);
    border: none; outline: none;
    display: flex; align-items: stretch; justify-content: stretch;
    overflow: hidden;
}
.mail-template-band.empty {
    padding: 8px 16px; min-height: 32px; max-height: none;
    color: rgba(200,200,220,0.2);
    font-style: italic;
}

/* Body textarea */
.mail-compose-textarea {
    flex: 1; width: 100%; border: none; outline: none; background: transparent;
    color: var(--text-primary, #fff); padding: 12px 16px;
    font-family: inherit; font-size: 0.95rem; line-height: 1.6; resize: none;
    min-height: 80px;
}

/* Bottom action bar */
.mail-modal-footer {
    padding: 12px 20px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.02);
    border-radius: 0 0 16px 16px;
    flex-shrink: 0; gap: 8px;
}
</style>

<div class="mail-modal-overlay" id="mail-compose-modal">
    <div class="mail-modal">

        <!-- Top bar: title + close -->
        <div class="mail-modal-header">
            <div class="mail-modal-title" id="mail-compose-title">New Message</div>
            <button class="mail-modal-close" onclick="mailCloseComposeModal()"><i class="fas fa-times"></i></button>
        </div>

        <!-- Fields: To, Cc, Subject, Template -->
        <div class="mail-fields-area">
            <input type="hidden" id="mail-compose-in-reply-to">

            <div class="mail-compose-row" style="position:relative">
                <div class="mail-compose-label">To:</div>
                <div style="flex:1; display:flex; gap:6px; position:relative;">
                    <input type="text" class="mail-compose-input" id="mail-compose-to"
                           name="fake-to-field" autocomplete="off"
                           placeholder="Recipient email or name..."
                           oninput="_mailContactsAutocomplete(this.value)">
                    <button class="mail-btn" style="padding:0 10px; font-size:.8rem; white-space:nowrap"
                            onclick="_mailToggleGroupPicker()" title="Send to a group from your address book">
                        <i class="fas fa-users"></i>
                    </button>
                </div>
                <!-- Autocomplete dropdown -->
                <ul id="mail-contacts-dropdown" style="
                    display:none; position:absolute; left:72px; top:100%; min-width:300px; max-width:500px;
                    background:var(--card-bg,#1e2030); border:1px solid var(--border,#333); border-radius:8px;
                    padding:4px 0; margin:0; list-style:none; z-index:9999;
                    box-shadow:0 8px 24px rgba(0,0,0,.4); max-height:220px; overflow-y:auto;">
                </ul>
            </div>
            <!-- Group/Tag picker (hidden by default) -->
            <div class="mail-compose-row" id="mail-group-picker-row" style="display:none">
                <div class="mail-compose-label" style="font-size:.8rem; color:var(--accent)"><i class="fas fa-tag"></i> Group:</div>
                <select id="mail-group-picker" class="mail-compose-input" style="max-width:220px; background-color:var(--bg2,#1e1e1e); color:var(--text,#fff);"
                        onchange="_mailApplyGroup(this.value)">
                    <option value="" style="background-color:var(--bg2,#1e1e1e); color:var(--text,#fff);">-- Select a tag/group --</option>
                </select>
                <span id="mail-group-count" style="font-size:.8rem; opacity:.6; margin-left:8px;"></span>
            </div>
            <div class="mail-compose-row">
                <div class="mail-compose-label">Cc:</div>
                <input type="text" class="mail-compose-input" id="mail-compose-cc"
                       name="fake-cc-field" autocomplete="new-password" placeholder="">
            </div>
            <div class="mail-compose-row">
                <div class="mail-compose-label">Subject:</div>
                <input type="text" class="mail-compose-input" id="mail-compose-subject"
                       name="fake-subj-field" autocomplete="new-password"
                       placeholder="" style="font-weight:600">
            </div>
            <div class="mail-compose-row">
                <div class="mail-compose-label">Template:</div>
                <select id="mail-compose-template" onchange="mailApplyTemplate(this.value)">
                    <option value="">-- No Template --</option>
                </select>
            </div>
        </div>

        <!-- 3-part composer: Header / Body / Footer -->
        <div class="mail-compose-3panel">

            <!-- HEADER band -->
            <div class="mail-compose-section">
                <div class="mail-compose-section-label">
                    <span class="section-badge badge-header">HEADER</span>
                    <span>Template header — read only</span>
                </div>
                <div class="mail-compose-section-content">
                    <div class="mail-template-band empty" id="mail-compose-header-preview">No template selected</div>
                    <iframe class="mail-template-iframe" id="mail-compose-header-iframe" style="display:none" sandbox="allow-same-origin"></iframe>
                </div>
            </div>

            <!-- BODY — user writes here -->
            <div class="mail-compose-section body-section">
                <div class="mail-compose-section-label">
                    <span class="section-badge badge-body">BODY</span>
                    <span>Your message</span>
                </div>
                <div class="mail-compose-section-content" style="flex:1; min-height:0; display:flex; flex-direction:column;">
                    <textarea class="mail-compose-textarea" id="mail-compose-body"
                              placeholder="Write your message here..."></textarea>
                </div>
            </div>

            <!-- FOOTER band -->
            <div class="mail-compose-section">
                <div class="mail-compose-section-label">
                    <span class="section-badge badge-footer">FOOTER</span>
                    <span>Template footer — read only</span>
                </div>
                <div class="mail-compose-section-content">
                    <div class="mail-template-band empty" id="mail-compose-footer-preview">No template selected</div>
                    <iframe class="mail-template-iframe" id="mail-compose-footer-iframe" style="display:none" sandbox="allow-same-origin"></iframe>
                </div>
            </div>

        </div>

        <!-- Bottom action bar -->
        <div class="mail-modal-footer">
            <button class="mail-btn" onclick="mailSaveDraft()">
                <i class="fas fa-save"></i> Draft
            </button>
            <button class="mail-btn primary" onclick="mailSend()" id="mail-send-btn">
                <i class="fas fa-paper-plane"></i> Send
            </button>
        </div>

    </div>
</div>
