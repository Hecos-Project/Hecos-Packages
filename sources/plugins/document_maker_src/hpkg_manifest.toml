id = "document_maker"
manifest_version = "1"
name = "Document Maker"
version = "1.4.1"
author = "Hecos Team / Antonio Meloni"
license = "GPL-3.0"
description = "Generates and modifies PDF/HTML documents from templates or raw HTML using Playwright."
type = "plugin"
pip_isolation = "shared"
target_dir = "hpm"
plugin_dir = "."
hecos_min_version = "0.40.0"
icon_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/Hecos_module_Image_preview_square.png"
readme = "README.md"
readme_url = ""
dependencies = [
    "templates",
]
pip_requirements = [
    "beautifulsoup4",
]
tag = "DOCS"
lazy_load = true
is_class_based = true
api_routes_file = "web/routes.py"
signature = "j53YPmKgCrtWVquddCWqW0WnQCHUSHdum0t0woaf7rjcEpeqoF9OkD3/RHlmhqviMoopfW+mimfT8ylDvfIYAQ=="

[[slash_commands]]
id = "pdf"
aliases = [
    "/pdf",
    "/makepdf",
    "/documento",
]
description = "Genera un documento PDF da un testo HTML o da un template Hecos"

[[slash_commands]]
id = "generate_pdf"
aliases = [
    "/DOCS__generate_pdf",
    "/pdf",
    "/generate_pdf",
]
description = "Generate a PDF document from a template ID or raw HTML."
requires_args = true

[[slash_commands]]
id = "modify_document"
aliases = [
    "/DOCS__modify_document",
    "/doc_edit",
    "/modify_document",
]
description = "Modify an existing document and regenerate its PDF."
requires_args = true

[[slash_commands]]
id = "list_documents"
aliases = [
    "/DOCS__list_documents",
    "/docs_list",
    "/list_documents",
]
description = "List all saved HTML and PDF documents."
requires_args = true

[[slash_commands]]
id = "optimize_layout"
aliases = [
    "/DOCS__optimize_layout",
    "/doc_layout",
    "/optimize_layout",
]
description = "Analyze an HTML document to find pagination errors (cut-off elements) and get suggestions for page breaks."
requires_args = true

[commands]
generate_pdf = "Converts HTML content to a PDF file and returns the file path."
list_documents = "Lists all documents in the documents folder."
modify_document = "Modifies an existing HTML document (add images, replace sections, change layout)."
optimize_layout = "Calculates page breaks for a document and returns a report of elements split across pages."

[capabilities]
llm_tools = [
    "generate_pdf",
    "list_documents",
    "modify_document",
    "optimize_layout",
]
slash_commands = [
    "/pdf",
    "/makepdf",
    "/documento",
    "/DOCS__generate_pdf",
    "/pdf",
    "/generate_pdf",
    "/DOCS__modify_document",
    "/doc_edit",
    "/modify_document",
    "/DOCS__list_documents",
    "/docs_list",
    "/list_documents",
    "/DOCS__optimize_layout",
    "/doc_layout",
    "/optimize_layout",
]
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = "Uses Playwright via the browser_automation core module. Falls back to standalone Playwright if browser_automation is unavailable."

[config_panel]
tab_id = "docs"
tab_label = "Document Maker"
tab_icon = "<i class=\"fas fa-file-pdf\"></i>"
template_file = "web/templates/config_document_maker.html"
js_file = "web/static/js/document_maker_panel.js"
category = "MULTIMEDIA"
config_api_get = "/hecos/api/plugins/document_maker/config"
config_api_post = "/hecos/api/plugins/document_maker/config"

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "DOCS__generate_pdf"
description = "Generates a PDF and HTML document from a template ID or raw HTML. Returns the absolute path of the generated files.\n\nIMPORTANT GUIDELINES:\n- Formatting: When writing raw HTML, you MUST include complete inline CSS (e.g. `body { margin: 0; padding: 20px; font-family: sans-serif; } * { box-sizing: border-box; }`) to ensure the PDF layout is correct and borders work.\n- Images: Use `<img src=\"/api/images/FILENAME\">` to include images. Images are stored in `media/images`.\n- Workflow: You can reuse previously generated images without calling the image generator again. ONLY generate new images if the user explicitly asks for them or if they don't exist. NEVER stop after image generation; always proceed to call this tool to finish the document.\n\nIf Playwright/Chromium is unavailable, the HTML version will still be saved successfully."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.html_content]
type = "string"
description = "Optional: Raw HTML content to convert to a document. Use <img src=\"/api/images/FILENAME\"> for generated images. If provided, template_id is ignored."

[tool_schema.function.parameters.properties.template_id]
type = "string"
description = "Optional: The ID of an existing template to render and convert."

[tool_schema.function.parameters.properties.template_vars]
type = "string"
description = "Optional: JSON string of variables to inject into the template if template_id is used."

[tool_schema.function.parameters.properties.filename]
type = "string"
description = "Optional: Desired name for the output file (e.g. 'magazine.pdf'). If not provided, a random UUID name will be used."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "DOCS__list_documents"
description = "Lists all documents in the documents folder with their size and a content preview. Use this BEFORE modify_document to find the correct file path and understand the document structure."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.search]
type = "string"
description = "Optional: Search term to filter documents by filename (e.g. 'jun' or 'fotoromanzo')."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "DOCS__modify_document"
description = "Modifies an existing HTML document in media/documents. The PDF is automatically regenerated after modification.\n\nUse this when the user asks to:\n- Add missing photos to an existing document\n- Change the layout (e.g. from 2 to 3 columns)\n- Replace or update a section of text\n- Append new content to a document\n\nTIP: Call DOCS__list_documents first to find the document and understand its structure."

[tool_schema.function.parameters]
type = "object"
required = [
    "file_path",
    "operation",
    "content",
]

[tool_schema.function.parameters.properties.file_path]
type = "string"
description = "Path or filename of the document to modify. Can be a full path, a filename (e.g. 'jun_magic_preview.html'), or a partial name (e.g. 'jun_magic')."

[tool_schema.function.parameters.properties.operation]
type = "string"
description = "The modification operation: 'add_images' (insert images into gallery or at placeholder), 'replace_section' (replace element by CSS selector), 'change_layout' (inject CSS rules), 'append' (add before </body>), 'patch' (find-and-replace text)."

[tool_schema.function.parameters.properties.content]
type = "string"
description = "The HTML content, <img> tags, or CSS rules to inject depending on the operation."

[tool_schema.function.parameters.properties.target_selector]
type = "string"
description = "Optional: For 'replace_section' a CSS selector (e.g. '.gallery', '#section2'). For 'patch' the exact text to find. For 'add_images' an optional placeholder text to replace with images."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "DOCS__optimize_layout"
description = "Calculates page breaks for a document and returns a report of elements split across pages. Used to analyze pagination and determine where manual page breaks are needed."

[tool_schema.function.parameters]
type = "object"
required = [
    "document_id",
]

[tool_schema.function.parameters.properties.document_id]
type = "string"
description = "The ID or filename of the document to optimize (e.g. 'magazine.html')."

