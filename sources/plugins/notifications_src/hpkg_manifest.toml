[[slash_command]]
action_type = "llm_agent"
description = "Manage notifications: list rules, add/remove destinations, bind events, or send ad-hoc alerts. Examples: '/notify list rules', '/notify send test to admin', '/notify bind system_boot to admin_email'."
name = "/notify"
prompt_template = "Help me manage my notifications. Request: {{user_input}}. If no specific action is given, list current rules and destinations."

[[slash_command]]
action_type = "llm_agent"
description = "Send an immediate notification. Example: '/alert Server is down!' or '/alert to admin_email System restarted'."
name = "/alert"
prompt_template = "I want to send an immediate notification. Use the send_notification tool. Request: {{user_input}}"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Lists all configured notification destinations. Use when the user asks 'show my notification destinations', 'chi riceve le notifiche?', 'lista destinatari notifiche'."
name = "NOTIFICATIONS__list_destinations"

[tool_schema.function.parameters]
type = "object"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Adds a new notification destination. Use when the user says 'add a notification destination', 'aggiungi destinatario notifica', 'send notifications to X'."
name = "NOTIFICATIONS__add_destination"

[tool_schema.function.parameters]
required = [
    "name",
    "uri",
]
type = "object"

[tool_schema.function.parameters.properties.name]
description = "Friendly name for the destination (e.g. 'admin_email', 'team_telegram')."
type = "string"

[tool_schema.function.parameters.properties.uri]
description = "Destination URI. Formats: MAIL:user@example.com, CONTACT:<uuid>, MESSENGER:Telegram:@username."
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Removes a notification destination by name. Use when the user says 'remove notification destination', 'rimuovi destinatario'."
name = "NOTIFICATIONS__remove_destination"

[tool_schema.function.parameters]
required = [
    "name",
]
type = "object"

[tool_schema.function.parameters.properties.name]
description = "The name of the destination to remove."
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Lists all system events and which destinations are bound to each. Use when the user asks 'show notification rules', 'quali eventi hanno notifiche?', 'mostra regole notifiche'."
name = "NOTIFICATIONS__list_rules"

[tool_schema.function.parameters]
type = "object"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Binds a destination to a system event so notifications are sent there. Use when the user says 'notify admin on system boot', 'manda notifica a X quando succede Y'."
name = "NOTIFICATIONS__bind_event_destination"

[tool_schema.function.parameters]
required = [
    "event",
    "destination_name",
]
type = "object"

[tool_schema.function.parameters.properties.destination_name]
description = "Name of an existing destination to bind."
type = "string"

[tool_schema.function.parameters.properties.event]
description = "Event type: system_boot, system_shutdown, system_error, flow_started, flow_completed, flow_failed, package_installed, package_updated, package_removed, security_login_failed, security_new_device, backup_started, backup_completed, backup_failed, custom."
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Removes a destination from a system event. Use when the user says 'stop notifying X on event Y', 'rimuovi notifica per evento'."
name = "NOTIFICATIONS__unbind_event_destination"

[tool_schema.function.parameters]
required = [
    "event",
    "destination_name",
]
type = "object"

[tool_schema.function.parameters.properties.destination_name]
description = "The destination name to unbind."
type = "string"

[tool_schema.function.parameters.properties.event]
description = "The event type string (e.g. 'system_boot')."
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Configures an HTML template and its variables for a given event. Use when the user says 'set template for system boot', 'usa questo template per le notifiche'."
name = "NOTIFICATIONS__set_event_template"

[tool_schema.function.parameters]
required = [
    "event",
]
type = "object"

[tool_schema.function.parameters.properties.event]
description = "The event type string (e.g. 'system_boot')."
type = "string"

[tool_schema.function.parameters.properties.template_id]
description = "UUID of the template to use. Pass empty string to clear."
type = "string"

[tool_schema.function.parameters.properties.variables]
description = "JSON string of key-value pairs for template variables (e.g. '{\"subject\":\"Hello\",\"message\":\"World\"}')."
type = "string"

[[tool_schema]]
type = "function"

[tool_schema.function]
description = "Sends an ad-hoc notification immediately. Use when the user says 'send a notification', 'manda una notifica', 'notify admin that X happened', 'avvisa che'."
name = "NOTIFICATIONS__send_notification"

[tool_schema.function.parameters]
required = [
    "subject",
    "message",
]
type = "object"

[tool_schema.function.parameters.properties.destination]
description = "Optional destination URI (e.g. 'MAIL:user@example.com'). If omitted, sends to all configured destinations."
type = "string"

[tool_schema.function.parameters.properties.message]
description = "Notification body text."
type = "string"

[tool_schema.function.parameters.properties.subject]
description = "Notification subject line."
type = "string"

[tool_schema.function.parameters.properties.template_id]
description = "Optional template UUID to render the message with."
type = "string"
