api_routes_file = "web/routes.py"
author = "Antonio Meloni"
dependencies = []
description = "Event notification system for Hecos. Sends notifications via MAIL or MESSENGER when system events occur (boot, errors, Flow completion, etc.). Requires at least one of the MAIL or MESSENGER plugins installed."
hecos_min_version = "0.48.0"
icon_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/Hecos_module_Image_preview_square.png"
id = "notifications"
is_class_based = true
lazy_load = false
license = "GPL-3.0"
manifest_version = "1"
name = "Notifications Center"
on_load = true
optional_dependencies = [
    "mail",
    "messenger",
]
pip_isolation = "shared"
pip_requirements = []
plugin_dir = "."
readme = "README.md"
signature = "v9ra7Qt1Ykcjx2OiHxkSWMyqgSwKtEXPpqSCg1Bm2zySSFhXfgBVpO255WwguYAwIMWC0X1tfYH+bZ/QWiYJAg=="
tag = "NOTIFICATIONS"
target_dir = "hpm"
type = "plugin"
version = "1.0.0"
date = ""

[capabilities]
llm_tools = [
    "list_destinations",
    "add_destination",
    "remove_destination",
    "list_rules",
    "bind_event_destination",
    "unbind_event_destination",
    "set_event_template",
    "send_notification",
]
slash_commands = []
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = "Plugin-driven notification router. No credentials required — it delegates sending to the MAIL or MESSENGER plugins. Supports events: system_boot, system_shutdown, system_error, flow_started, flow_completed, flow_failed, package_installed, security_login_failed."

[commands]
add_destination = "Adds a new notification destination (MAIL, CONTACT, or MESSENGER)."
bind_event_destination = "Binds a destination to a system event."
list_destinations = "Lists all configured notification destinations."
list_rules = "Lists all system events and their bound destinations."
remove_destination = "Removes a notification destination by name."
send_notification = "Sends an ad-hoc notification immediately."
set_event_template = "Configures an HTML template for a system event."
unbind_event_destination = "Removes a destination from a system event."

[config_panel]
api_routes_file = "web/routes.py"
category = "SISTEMA"
config_api_get = "/hecos/api/plugins/notifications/config"
config_api_post = "/hecos/api/plugins/notifications/config"
js_file = "web/assets/js/notifications.js"
tab_icon = "fas fa-bell"
tab_id = "notifications"
tab_label = "Notifications"
template_file = "web/templates/hpm_notifications.html"

