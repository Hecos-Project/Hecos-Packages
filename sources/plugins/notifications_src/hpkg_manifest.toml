id = "notifications"
manifest_version = "1"
name = "Notifications Center"
version = "1.0.0"
author = "Antonio Meloni"
license = "GPL-3.0"
description = "Event notification system for Hecos. Sends notifications via MAIL or MESSENGER when system events occur (boot, errors, Flow completion, etc.). Requires at least one of the MAIL or MESSENGER plugins installed."
type = "plugin"
pip_isolation = "shared"
target_dir = "hpm"
plugin_dir = "."
hecos_min_version = "0.48.0"
icon_url = "https://raw.githubusercontent.com/Hecos-Project/Hecos-Packages/main/Hecos_module_Image_preview_square.png"
readme = "README.md"
dependencies = []
optional_dependencies = [
    "mail",
    "messenger",
]
pip_requirements = []
tag = "NOTIFICATIONS"
lazy_load = false
is_class_based = true
on_load = true
api_routes_file = "web/routes.py"
signature = "m5pg0OiqXEkw1DUJbkaxf0RGYhDI4T+bq5CSfRc/j2FUXB6YVsy7Vb4EcVL/Uv/2VtnYJvgx4QTm2KrtpxJYAw=="

[config_panel]
tab_id = "notifications"
tab_label = "Notifications"
tab_icon = "fas fa-bell"
category = "SISTEMA"
template_file = "web/templates/hpm_notifications.html"
js_file = "web/assets/js/notifications.js"
api_routes_file = "web/routes.py"
config_api_get = "/hecos/api/plugins/notifications/config"
config_api_post = "/hecos/api/plugins/notifications/config"

[capabilities]
llm_tools = []
slash_commands = []
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = "Plugin-driven notification router. No credentials required — it delegates sending to the MAIL or MESSENGER plugins. Supports events: system_boot, system_shutdown, system_error, flow_started, flow_completed, flow_failed, package_installed, security_login_failed."

