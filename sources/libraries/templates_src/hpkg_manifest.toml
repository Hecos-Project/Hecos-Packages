id = "templates"
manifest_version = "1"
name = "Templates"
readme = "README.md"
tag = "TEMPLATES"
type = "library"
description = "Centralized template manager for communications (Mail, WhatsApp, Telegram)."
version = "1.3.3"
author = "Antonio Meloni"
pip_isolation = "shared"
target_dir = "hpm/libraries"
plugin_dir = "."
lazy_load = true
is_class_based = true
api_routes_file = "web/routes.py"
dependencies = [
    "premailer",
]
signature = "etfbtZJB0z0uIf+P5pxkY3dj4X62W9zu1LokLBPASZj224mnMuhwFyjCE7fyzI3tT41mQ8uFVYbqja/ATlH5Bg=="
license = "GPL-V3"

[config_panel]
tab_id = "templates"
tab_label = "Templates"
tab_icon = "fa-file-alt"
category = "CONNETTIVITÀ"
template_file = "web/templates/config_templates.html"
js_file = "web/assets/js/templates.js"
api_routes_file = "web/routes.py"
config_api_get = "/hecos/api/plugins/templates/config"
config_api_post = "/hecos/api/plugins/templates/config"

[capabilities]
llm_tools = [
    "list_templates",
    "render_template",
    "create_template",
    "update_template",
]
slash_commands = []
has_widget = false
has_config_panel = true
has_api_routes = true
has_system_calls = false
syscall_notes = ""
notes = ""

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "TEMPLATES__list_templates"
description = "List all available templates. Channel is optional (e.g. 'whatsapp', 'email', 'telegram', 'discord')."

[tool_schema.function.parameters]
type = "object"

[tool_schema.function.parameters.properties.channel]
type = "string"
description = "Optional channel filter."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "TEMPLATES__render_template"
description = "Render a template by replacing its variables and combining header/body/footer. Use this before sending a message if you want to use a specific template."

[tool_schema.function.parameters]
type = "object"
required = [
    "template_id_or_name",
    "variables",
]

[tool_schema.function.parameters.properties.template_id_or_name]
type = "string"
description = "The ID or the exact Name of the template."

[tool_schema.function.parameters.properties.variables]
type = "string"
description = "A JSON string of variables to inject."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "TEMPLATES__create_template"
description = "Creates a new custom HTML/CSS template from scratch. You can include Jinja variables (e.g. {{ title }}). Returns the ID of the new template."

[tool_schema.function.parameters]
type = "object"
required = [
    "name",
    "body_html",
]

[tool_schema.function.parameters.properties.name]
type = "string"
description = "The name of the new template."

[tool_schema.function.parameters.properties.body_html]
type = "string"
description = "The raw HTML and CSS content of the template."

[tool_schema.function.parameters.properties.subject]
type = "string"
description = "Optional default subject for the email."

[tool_schema.function.parameters.properties.description]
type = "string"
description = "Optional description of what the template is for."

[[tool_schema]]
type = "function"

[tool_schema.function]
name = "TEMPLATES__update_template"
description = "Updates the HTML content of an existing template."

[tool_schema.function.parameters]
type = "object"
required = [
    "template_id",
    "body_html",
]

[tool_schema.function.parameters.properties.template_id]
type = "string"
description = "The ID of the template to update."

[tool_schema.function.parameters.properties.body_html]
type = "string"
description = "The new raw HTML and CSS content."

